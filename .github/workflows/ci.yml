name: Verificação contínua

on:
  push:
  pull_request:

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Conferir sintaxe
        run: python -m compileall -q src tests scripts
      - name: Executar testes
        run: python -m unittest discover -s tests -v
      - name: Instalar validador CloudFormation
        run: python -m pip install cfn-lint==1.60.0
      - name: Validar infraestrutura
        run: cfn-lint infra/template.yaml
      - name: Empacotar função Lambda
        run: python scripts/package.py
      - name: Testar pacote gerado
        run: python scripts/check_package.py
